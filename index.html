            animation: fadeIn 0.3s ease-out forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tab-btn.active {
            background-color: white;
            color: #4f46e5;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen font-sans antialiased overflow-x-hidden">
    <!-- Ambient Background -->
    <div class="fixed inset-0 -z-10 bg-gray-50 bg-stripes"></div>
    <div
        class="fixed top-0 left-0 w-[500px] h-[500px] bg-brand-500/20 rounded-full blur-[120px] mix-blend-multiply opacity-70 animate-blob pointer-events-none">
    </div>
    <div
        class="fixed top-[-10%] right-[-5%] w-[400px] h-[400px] bg-pink-500/20 rounded-full blur-[120px] mix-blend-multiply opacity-70 animate-blob animation-delay-2000 pointer-events-none">
    </div>
    <div
        class="fixed bottom-0 left-[20%] w-[600px] h-[600px] bg-purple-500/20 rounded-full blur-[120px] mix-blend-multiply opacity-70 animate-blob animation-delay-4000 pointer-events-none">
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 relative z-10">
        <!-- Logo & Header -->
        <div class="text-center mb-12">
            <img src="logo.png.png" alt="Zainabiyya Ladies College"
                class="w-40 h-40 md:w-48 md:h-48 object-contain mx-auto mb-6 drop-shadow-xl hover:scale-105 transition-transform duration-500">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight mb-3">Zainabiyya Ladies College For

            <p class="text-gray-500 text-lg md:text-xl font-medium max-w-2xl mx-auto">Centralized Administrative Portal.
                Select a module below to securely access your workspace.</p>
        </div>

        <!-- Module Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 max-w-6xl w-full mx-auto">
            <!-- Student Module -->
            <button onclick="openModal('student')"
                class="group relative bg-white/70 backdrop-blur-xl p-8 rounded-[2rem] border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgb(99,102,241,0.15)] transition-all duration-500 transform hover:-translate-y-2 overflow-hidden text-left flex flex-col focus:outline-none focus:ring-4 focus:ring-brand-500/20">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-brand-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
                <div
                    class="w-16 h-16 bg-gradient-to-br from-brand-100 to-brand-50 rounded-2xl flex items-center justify-center mb-6 border border-brand-200/50 group-hover:scale-110 transition-transform duration-500">
                    <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M12 14l9-5-9-5-9 5 9 5z"></path>
                        <path
                            d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5zm0 0v6"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2 group-hover:text-brand-600 transition-colors">Student
                    DB</h3>
                <p class="text-gray-500 font-medium text-sm leading-relaxed mb-6 flex-grow">Manage student enrollments,
                    exam results, fees, and generating reports.</p>
                <div class="flex items-center text-brand-600 font-bold text-sm w-full">
                    <span>Access Module</span>
                    <svg class="w-4 h-4 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                    </svg>
                </div>
            </button>

            <!-- Staff Module -->
            <button onclick="openModal('staff')"
                class="group relative bg-white/70 backdrop-blur-xl p-8 rounded-[2rem] border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgb(236,72,153,0.15)] transition-all duration-500 transform hover:-translate-y-2 overflow-hidden text-left flex flex-col focus:outline-none focus:ring-4 focus:ring-pink-500/20">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-pink-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
                <div
                    class="w-16 h-16 bg-gradient-to-br from-pink-100 to-pink-50 rounded-2xl flex items-center justify-center mb-6 border border-pink-200/50 group-hover:scale-110 transition-transform duration-500">
                    <svg class="w-8 h-8 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2 group-hover:text-pink-600 transition-colors">Staff DB
                </h3>
                <p class="text-gray-500 font-medium text-sm leading-relaxed mb-6 flex-grow">Manage staff records,
                    salaries, attendance, and administrative duties.</p>
                <div class="flex items-center text-pink-600 font-bold text-sm w-full">
                    <span>Access Module</span>
                    <svg class="w-4 h-4 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                    </svg>
                </div>
            </button>

            <!-- Library Module -->
            <button onclick="openModal('library')"
                class="group relative bg-white/70 backdrop-blur-xl p-8 rounded-[2rem] border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgb(168,85,247,0.15)] transition-all duration-500 transform hover:-translate-y-2 overflow-hidden text-left flex flex-col focus:outline-none focus:ring-4 focus:ring-purple-500/20">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-purple-500/5 to-indigo-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
                <div
                    class="w-16 h-16 bg-gradient-to-br from-purple-100 to-purple-50 rounded-2xl flex items-center justify-center mb-6 border border-purple-200/50 group-hover:scale-110 transition-transform duration-500">
                    <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2 group-hover:text-purple-600 transition-colors">Library
                    DB</h3>
                <p class="text-gray-500 font-medium text-sm leading-relaxed mb-6 flex-grow">Library catalog, book
                    issue/return tracking, and inventory management.</p>
                <div class="flex items-center text-purple-600 font-bold text-sm w-full">
                    <span>Access Module</span>
                    <svg class="w-4 h-4 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                    </svg>
                </div>
            </button>
        </div>

        <div class="text-center mt-16 text-sm font-medium text-gray-500/80 backdrop-blur-sm px-4 py-2 rounded-full">
            &copy; 2026 Zainabiyya Ladies College. All rights reserved.
        </div>
    </div>

    <!-- Login Modal overlay -->
    <div id="loginModal" class="fixed inset-0 z-50 hidden flex-col items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-md transition-opacity" onclick="closeModal()"></div>

        <!-- Modal Content -->
        <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-8 md:p-10 max-w-md w-full mx-4 shadow-[0_20px_60px_rgb(0,0,0,0.15)] border border-white relative overflow-hidden transform scale-95 opacity-0 transition-all duration-300"
            id="loginModalContent">

            <div id="modalTopAccent"
                class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-500 to-purple-500"></div>

            <button onclick="closeModal()"
                class="absolute top-6 right-6 text-gray-400 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <!-- Forms -->
            <form id="loginForm" class="space-y-5 mt-2" onsubmit="handleLogin(event)">
                <div class="text-center mb-8">
                    <div id="modalIcon"
                        class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5 text-white bg-gradient-to-br from-brand-500 to-brand-600 shadow-lg shadow-brand-500/30">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </div>
                    <h2 id="formTitle" class="text-3xl font-bold text-gray-900 tracking-tight">Student Access</h2>
                    <p class="text-sm text-gray-500 font-medium mt-2">Enter credentials to securely login</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2" for="username">Username</label>
                    <input type="text" id="username" required
                        class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition-all outline-none bg-gray-50 hover:bg-gray-100 focus:bg-white placeholder:text-gray-400 font-medium text-gray-900">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2" for="password">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition-all outline-none bg-gray-50 hover:bg-gray-100 focus:bg-white placeholder:text-gray-400 font-medium text-gray-900">
                </div>

                <div id="loginError"
                    class="hidden text-red-500 text-sm font-bold text-center mt-3 p-3 bg-red-50/80 rounded-xl border border-red-100">
                    Invalid username or password!</div>

                <button type="submit" id="submitBtn"
                    class="w-full py-4 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-500/25 transition-all transform hover:-translate-y-0.5 mt-8 border border-white/20 flex items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-brand-500/20">
                    <span>Authenticate</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentModule = '';

        const modules = {
            'student': {
                title: 'Student Database',
                redirect: 'student.html',
                gradient: 'from-brand-500 to-brand-600',
                shadow: 'shadow-brand-500/30'
            },
            'staff': {
                title: 'Staff Database',
                redirect: 'staff.html',
                gradient: 'from-pink-500 to-rose-500',
                shadow: 'shadow-pink-500/30'
            },
            'library': {
                title: 'Library Database',
                redirect: 'library.html',
                gradient: 'from-purple-500 to-indigo-500',
                shadow: 'shadow-purple-500/30'
            }
        };

        function openModal(module) {
            currentModule = module;
            const config = modules[module];

            // Update modal UI
            document.getElementById('formTitle').textContent = config.title;

            // Update accents based on module colors
            document.getElementById('modalTopAccent').className = `absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${config.gradient}`;
            document.getElementById('modalIcon').className = `w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-5 text-white bg-gradient-to-br ${config.gradient} shadow-lg ${config.shadow}`;
            document.getElementById('submitBtn').className = `w-full py-4 bg-gradient-to-r ${config.gradient} hover:brightness-110 text-white font-bold rounded-xl shadow-lg ${config.shadow} transition-all transform hover:-translate-y-0.5 mt-8 border border-white/20 flex items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-gray-200`;

            // Reset form
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('hidden');

            // Show modal
            const modal = document.getElementById('loginModal');
            const modalContent = document.getElementById('loginModalContent');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // trigger reflow
            void modal.offsetWidth;

            modalContent.classList.remove('scale-95', 'opacity-0');
            modalContent.classList.add('scale-100', 'opacity-100');

            setTimeout(() => {
                document.getElementById('username').focus();
            }, 100);
        }

        function closeModal() {
            const modal = document.getElementById('loginModal');
            const modalContent = document.getElementById('loginModalContent');

            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // Default credentials per module
            const creds = {
                'student': { user: 'admin', pass: 'admin123' },
                'staff': { user: 'staffadmin', pass: 'staff123' },
                'library': { user: 'libadmin', pass: 'lib123' }
            };

            if (user === creds[currentModule].user && pass === creds[currentModule].pass) {
                // Login Success
                document.getElementById('loginError').classList.add('hidden');

                // Allow bypassing the old login logic in respective pages
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('loggedInModule', currentModule);

                // Animate out
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';

                setTimeout(() => {
                    window.location.href = modules[currentModule].redirect;
                }, 500);
            } else {
                // Login Failed
                const errorEl = document.getElementById('loginError');
                errorEl.classList.remove('hidden');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                // Shake animation for error
                const modalContent = document.getElementById('loginModalContent');
                modalContent.style.transform = 'scale(100%) translateX(-10px)';
                setTimeout(() => modalContent.style.transform = 'scale(100%) translateX(10px)', 100);
                setTimeout(() => modalContent.style.transform = 'scale(100%) translateX(-10px)', 200);
                setTimeout(() => modalContent.style.transform = 'scale(100%) translateX(0)', 300);
            }
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('loginModal').classList.contains('hidden')) {
                closeModal();
            }
        });

        // Close modal when clicking outside
        document.getElementById('loginModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('loginModal')) {
                closeModal();
            }
        });
    </script>
    <div class="fixed bottom-3 right-4 text-xs font-medium text-gray-400/80 z-50 pointer-events-none tracking-wide">
        System by: AliRiza
    </div>
</body>
